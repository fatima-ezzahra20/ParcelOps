version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: parcelops_postgres
    restart: always
    environment:
      POSTGRES_USER: parcelops_user
      POSTGRES_PASSWORD: parcelops_pass
      POSTGRES_DB: parcelops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: parcelops_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@parcelops.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: