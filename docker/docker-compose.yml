version: '3.8'

x-airflow-common-env: &airflow-common-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow_postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__FERNET_KEY: ''
  AIRFLOW__WEBSERVER__SECRET_KEY: 'parcelops_shared_secret_key_2026'
  # Connexion à LA BASE SOURCE de ton projet (le container 'postgres' plus bas)
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: parcelops_db
  DB_USER: parcelops_user
  DB_PASSWORD: parcelops_pass
  # Depuis un container, 'localhost' ne pointe pas vers ta machine hôte
  EVENTS_API_URL: http://host.docker.internal:8000/delivery_events
  PYTHONPATH: /opt/airflow/project

services:
  # ---------------- Base de données SOURCE du projet ----------------
  postgres:
    image: postgres:15
    container_name: parcelops_postgres
    restart: always
    environment:
      POSTGRES_USER: parcelops_user
      POSTGRES_PASSWORD: parcelops_pass
      POSTGRES_DB: parcelops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: parcelops_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@parcelops.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # ---------------- Base de métadonnées d'AIRFLOW (séparée) ----------------
  airflow_postgres:
    image: postgres:15
    container_name: parcelops_airflow_postgres
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: parcelops_airflow_init
    depends_on:
      - airflow_postgres
    environment:
      <<: *airflow-common-env
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Fatima \
          --lastname Jabbade \
          --role Admin \
          --email admin@parcelops.com
    volumes:
      - ..:/opt/airflow/project

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: parcelops_airflow_webserver
    restart: always
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-common-env
    ports:
      - "8080:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ..:/opt/airflow/project
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: parcelops_airflow_scheduler
    restart: always
    depends_on:
      - airflow-init
    environment:
      <<: *airflow-common-env
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ..:/opt/airflow/project
    command: scheduler

volumes:
  postgres_data:
  airflow_postgres_data: